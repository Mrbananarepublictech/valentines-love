<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TextLink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff1744 0%, #f50057 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #ff1744;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .number {
            color: #ff1744;
            font-size: 32px;
            font-weight: bold;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .section h2 {
            color: #ff1744;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff1744;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        table th {
            background: #fde0e0;
            color: #ff1744;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        table tr:hover {
            background: #fff5f5;
        }
        
        .action-btn {
            padding: 6px 12px;
            margin: 0 4px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .btn-admin {
            background: #ff1744;
            color: white;
        }
        
        .btn-admin:hover {
            background: #c41c3b;
        }
        
        .btn-remove {
            background: #ffc400;
            color: white;
        }
        
        .btn-remove:hover {
            background: #ffb300;
        }
        
        .btn-delete {
            background: #d32f2f;
            color: white;
        }
        
        .btn-delete:hover {
            background: #b71c1c;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #ff1744;
        }
        
        .error {
            background: #ffebee;
            color: #c41c3b;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .logout-btn {
            background: #ff1744;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: #c41c3b;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-admin {
            background: #ff1744;
            color: white;
        }
        
        .badge-user {
            background: #e0e0e0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>💬 Admin Dashboard</h1>
                    <p>Manage TextLink</p>
                </div>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        
        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <div class="loading">Loading statistics...</div>
        </div>
        
        <!-- Users Section -->
        <div class="section" id="usersSection">
            <h2>👥 Users Management</h2>
            <div id="message"></div>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Verified</th>
                        <th>Followers</th>
                        <th>Likes</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="8" style="text-align: center;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>🚨 Open Reports</h2>
            <div id="reportsList">Loading…</div>
        </div>

        <div class="section">
            <h2>💳 Gift Orders</h2>
            <div id="ordersList">Loading…</div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        
        // Load statistics
        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats');
                const stats = await res.json();
                
                const statsHtml = `
                    <div class="stat-card">
                        <h3>Total Users</h3>
                        <div class="number">${stats.total_users}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Connection Requests</h3>
                        <div class="number">${stats.total_connection_requests || stats.total_valentine_requests}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Messages</h3>
                        <div class="number">${stats.total_messages}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Cards Sent</h3>
                        <div class="number">${stats.total_cards}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Gifts Sent</h3>
                        <div class="number">${stats.total_gifts_sent || 0}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Gift Revenue</h3>
                        <div class="number" style="font-size:1.4em;">${stats.revenue || '$0.00'}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Follows</h3>
                        <div class="number">${stats.total_follows}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Pending Requests</h3>
                        <div class="number" style="color: #ffc400;">${stats.pending_requests}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Open Reports</h3>
                        <div class="number" style="color:#ff1744;">${stats.open_reports || 0}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Stripe / Mail</h3>
                        <div class="number" style="font-size:1em;">${stats.stripe_enabled ? 'Stripe✓' : 'Stripe✗'} / ${stats.mail_configured ? 'Mail✓' : 'Mail✗'}</div>
                    </div>
                `;
                
                document.getElementById('statsGrid').innerHTML = statsHtml;
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('statsGrid').innerHTML = '<div class="error">Error loading statistics</div>';
            }
        }
        
        // Load users
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                let html = '';
                for (const user of users) {
                    const roleStr = user.is_banned
                        ? '<span class="badge badge-user" style="background:#ff1744;color:#fff;">Banned</span>'
                        : (user.is_admin ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>');
                    const joinedDate = new Date(user.created_at).toLocaleDateString();
                    
                    html += `
                        <tr>
                            <td><strong>${user.username}</strong></td>
                            <td>${user.email}</td>
                            <td>${roleStr}</td>
                            <td>${user.email_verified ? 'Yes' : 'No'}</td>
                            <td>${user.followers}</td>
                            <td>${user.likes_received}</td>
                            <td>${joinedDate}</td>
                            <td>
                                ${!user.is_admin ? `<button class="action-btn btn-admin" onclick="makeAdmin('${user.username}')">Make Admin</button>` : ''}
                                ${user.is_admin ? `<button class="action-btn btn-remove" onclick="removeAdmin('${user.username}')">Remove Admin</button>` : ''}
                                ${!user.is_banned ? `<button class="action-btn btn-remove" onclick="banUser('${user.username}')">Ban</button>` : `<button class="action-btn btn-admin" onclick="unbanUser('${user.username}')">Unban</button>`}
                                <button class="action-btn btn-delete" onclick="deleteUser('${user.username}')">Delete</button>
                            </td>
                        </tr>
                    `;
                }
                
                document.getElementById('usersBody').innerHTML = html || '<tr><td colspan="8" style="text-align: center;">No users found</td></tr>';
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersBody').innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Error loading users</td></tr>';
            }
        }
        
        // Make user admin
        async function makeAdmin(username) {
            if (!confirm(`Make ${username} an admin?`)) return;
            
            try {
                const res = await fetch(`/api/admin/users/${username}/make-admin`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('success', data.message);
                    loadUsers();
                } else {
                    showMessage('error', data.message);
                }
            } catch (error) {
                showMessage('error', 'Error making user admin');
            }
        }
        
        // Remove user admin
        async function removeAdmin(username) {
            if (!confirm(`Remove admin privileges from ${username}?`)) return;
            
            try {
                const res = await fetch(`/api/admin/users/${username}/remove-admin`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('success', data.message);
                    loadUsers();
                } else {
                    showMessage('error', data.message);
                }
            } catch (error) {
                showMessage('error', 'Error removing admin');
            }
        }
        
        // Delete user
        async function deleteUser(username) {
            if (!confirm(`PERMANENTLY delete ${username}? This cannot be undone!`)) return;
            
            try {
                const res = await fetch(`/api/admin/users/${username}/delete`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('success', data.message);
                    loadUsers();
                    loadStats();
                } else {
                    showMessage('error', data.message);
                }
            } catch (error) {
                showMessage('error', 'Error deleting user');
            }
        }
        
        async function banUser(username) {
            const reason = prompt(`Ban reason for ${username}:`) || '';
            if (!confirm(`Ban ${username}?`)) return;
            const res = await fetch(`/api/admin/users/${username}/ban`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason })
            });
            const data = await res.json();
            showMessage(data.success ? 'success' : 'error', data.message);
            loadUsers();
        }

        async function unbanUser(username) {
            const res = await fetch(`/api/admin/users/${username}/unban`, { method: 'POST' });
            const data = await res.json();
            showMessage(data.success ? 'success' : 'error', data.message);
            loadUsers();
        }

        async function loadReports() {
            try {
                const res = await fetch('/api/admin/reports?status=open');
                const reports = await res.json();
                if (!reports.length) {
                    document.getElementById('reportsList').innerHTML = '<p>No open reports.</p>';
                    return;
                }
                document.getElementById('reportsList').innerHTML = reports.map(r => `
                    <div style="background:#fff;padding:14px;border-radius:10px;margin-bottom:10px;">
                        <strong>${r.reported}</strong> reported by ${r.reporter}<br>
                        <span style="color:#666;">${r.reason}: ${r.message}</span><br>
                        <button class="action-btn btn-admin" onclick="resolveReport('${r.id}', false)">Resolve</button>
                        <button class="action-btn btn-remove" onclick="resolveReport('${r.id}', true)">Resolve + Ban</button>
                        <button class="action-btn btn-delete" onclick="dismissReport('${r.id}')">Dismiss</button>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('reportsList').innerHTML = '<p style="color:red;">Failed to load reports</p>';
            }
        }

        async function resolveReport(id, ban) {
            const note = prompt('Admin note:') || '';
            const res = await fetch(`/api/admin/reports/${id}/resolve`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'resolve', admin_note: note, ban_user: ban })
            });
            const data = await res.json();
            showMessage(data.success ? 'success' : 'error', data.success ? 'Report resolved' : data.message);
            loadReports(); loadUsers(); loadStats();
        }

        async function dismissReport(id) {
            const res = await fetch(`/api/admin/reports/${id}/resolve`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'dismiss' })
            });
            const data = await res.json();
            showMessage(data.success ? 'success' : 'error', data.success ? 'Dismissed' : data.message);
            loadReports(); loadStats();
        }

        async function loadOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                const orders = await res.json();
                if (!orders.length) {
                    document.getElementById('ordersList').innerHTML = '<p>No orders yet.</p>';
                    return;
                }
                document.getElementById('ordersList').innerHTML = `
                    <table><thead><tr><th>Gift</th><th>From</th><th>To</th><th>Status</th><th>Amount</th><th></th></tr></thead>
                    <tbody>${orders.map(o => `
                        <tr>
                            <td>${o.gift_name}</td><td>${o.from}</td><td>${o.to}</td>
                            <td>${o.status}</td><td>$${(o.price_cents/100).toFixed(2)}</td>
                            <td>${o.status === 'paid' ? `<button class="action-btn btn-remove" onclick="refundOrder('${o.id}')">Refund</button>` : ''}</td>
                        </tr>`).join('')}
                    </tbody></table>`;
            } catch (e) {
                document.getElementById('ordersList').innerHTML = '<p style="color:red;">Failed to load orders</p>';
            }
        }

        async function refundOrder(id) {
            if (!confirm('Refund this order?')) return;
            const res = await fetch(`/api/admin/orders/${id}/refund`, { method: 'POST' });
            const data = await res.json();
            showMessage(data.success ? 'success' : 'error', data.message);
            loadOrders(); loadStats();
        }

        function showMessage(type, message) {
            const msgDiv = document.getElementById('message');
            msgDiv.className = type;
            msgDiv.textContent = message;
            msgDiv.style.display = 'block';
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
        
        // Load on page load
        window.addEventListener('load', () => {
            loadStats();
            loadUsers();
            loadReports();
            loadOrders();
            setInterval(loadStats, 30000);
            setInterval(loadUsers, 30000);
            setInterval(loadReports, 30000);
            setInterval(loadOrders, 30000);
        });
    </script>
</body>
</html>
