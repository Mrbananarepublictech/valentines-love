<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextLink — Connect & Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0b1220;
            --muted: #64748b;
            --accent: #0891b2;
            --accent-strong: #0e7490;
            --accent-soft: #ecfeff;
            --surface: rgba(255,255,255,0.9);
            --line: rgba(15, 23, 42, 0.08);
            --radius: 22px;
            --font-display: 'Sora', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 12% 18%, rgba(8,145,178,0.45), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(249,115,22,0.28), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(14,116,144,0.25), transparent 45%),
                linear-gradient(145deg, #070b14 0%, #111827 48%, #0b3a48 100%);
            animation: bgShift 14s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(8deg); }
        }
        .container { width: 100%; max-width: 440px; }
        .card {
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
            animation: rise 0.7s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(28px) scale(.98); }
            to { opacity: 1; transform: none; }
        }
        .logo {
            width: 64px; height: 64px; margin: 0 auto 18px;
            display: grid; place-items: center;
            font-size: 1.8rem;
            border-radius: 18px;
            background: linear-gradient(145deg, #0891b2, #0e7490);
            color: white;
            box-shadow: 0 12px 30px rgba(8,145,178,0.45);
        }
        h1 {
            text-align: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 2.15rem;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
            background: linear-gradient(120deg, #0b1220 20%, #0e7490 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 28px;
            font-size: 0.95rem;
            line-height: 1.55;
            font-weight: 500;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 0.86rem;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            background: #f8fafc;
            transition: .2s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(8,145,178,0.15);
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
            padding: 6px;
            background: #f1f5f9;
            border-radius: 16px;
        }
        button {
            border: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            color: #fff;
            box-shadow: 0 10px 24px rgba(8,145,178,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(8,145,178,0.4); }
        .btn-secondary {
            background: transparent;
            color: #475569;
        }
        .btn-secondary.active {
            background: #fff;
            color: var(--accent-strong);
            box-shadow: 0 4px 14px rgba(15,23,42,0.08);
        }
        .message {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .message.show { display: block; animation: rise .35s ease; }
        .message.success { background: #ecfdf5; color: #047857; }
        .message.error { background: #fef2f2; color: #b91c1c; }
        .form-section { display: none; }
        .form-section.active { display: block; animation: rise .4s ease; }
        .loading { display: none; text-align: center; color: var(--accent-strong); margin-top: 12px; }
        .spinner {
            display: inline-block; width: 22px; height: 22px;
            border: 3px solid #e2e8f0; border-top-color: var(--accent);
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .heart-animation {
            position: fixed; pointer-events: none; font-size: 1.6rem;
            animation: floatUp 1.6s ease forwards; z-index: 100;
        }
        @keyframes floatUp {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-90px) scale(.6); }
        }
        a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            h1 { font-size: 1.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">💬</div>
            <h1>TextLink</h1>
            <p class="subtitle">Message, connect, and send real gifts — built for everyday texting.</p>

            <div class="message" id="message"></div>

            <div class="button-group">
                <button class="btn-secondary active" onclick="switchTab('login')">Login</button>
                <button class="btn-secondary" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="login" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                        Login
                    </button>
                    <p style="text-align:center;margin-top:14px;font-size:0.9em;"><a href="/forgot-password" style="color:#0f766e;font-weight:600;">Forgot password?</a></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register" class="form-section">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                        Create Account
                    </button>
                </form>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');

            document.querySelectorAll('.btn-secondary').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showMessage(message, type) {
            const el = document.getElementById('message');
            el.textContent = message;
            el.className = 'message show ' + type;
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function createHeartAnimation(e) {
            const hearts = ['💖', '💕', '💗', '❤️'];
            const heart = document.createElement('div');
            heart.className = 'heart-animation';
            heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = (e?.clientX || Math.random() * 100) + 'px';
            heart.style.top = (e?.clientY || Math.random() * 100) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Logged in successfully!', 'success');
                    createHeartAnimation();
                    setTimeout(() => {
                        window.location.href = data.needs_verification ? '/verify-pending' : '/dashboard';
                    }, 800);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    createHeartAnimation();
                    if (data.needs_verification) {
                        showMessage(data.message || 'Check your email to confirm your account.', 'success');
                        if (data.dev_verify_link) {
                            showMessage('Dev: open the confirmation link shown next…', 'success');
                            setTimeout(() => { window.location.href = data.dev_verify_link; }, 600);
                        } else {
                            setTimeout(() => { window.location.href = '/verify-pending'; }, 900);
                        }
                    } else {
                        showMessage('Account created!', 'success');
                        setTimeout(() => { window.location.href = '/dashboard'; }, 800);
                    }
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showWhatsAppModal() {
            let modal = document.getElementById('whatsappModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'whatsappModal';
                modal.style.position = 'fixed';
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100vw';
                modal.style.height = '100vh';
                modal.style.background = 'rgba(0,0,0,0.6)';
                modal.style.display = 'flex';
                modal.style.alignItems = 'center';
                modal.style.justifyContent = 'center';
                modal.style.zIndex = '9999';
                modal.innerHTML = `
                    <div style="background: white; border-radius: 16px; padding: 32px 24px; max-width: 350px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
                        <h2 style="color: #25D366; margin-bottom: 16px;">Join Our WhatsApp Channel</h2>
                        <p style="margin-bottom: 20px; color: #333;">Stay updated and connect with our community!<br><b>Click below to join:</b></p>
                        <a href="https://whatsapp.com/channel/0029VbCbjntKQuJDTeE1rT0h" target="_blank" style="display: inline-block; background: #25D366; color: white; font-weight: bold; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-size: 1.1em; margin-bottom: 16px;">Join WhatsApp Channel</a><br>
                        <button onclick="document.getElementById('whatsappModal').remove(); window.location.href='/dashboard';" style="margin-top: 10px; padding: 8px 20px; border: none; border-radius: 8px; background: #0f766e; color: white; font-weight: 600; cursor: pointer;">Continue to Dashboard</button>
                    </div>
                `;
                document.body.appendChild(modal);
            }
        }
    </script>
</body>
</html>
