<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm email — {{ app_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
            font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#0f172a,#1e3a5f 45%,#0f766e)}
        .card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
        h1{font-family:'Fraunces',serif;margin:0 0 8px;color:#0f172a}
        p{color:#64748b;line-height:1.5}
        .email{font-weight:700;color:#0f766e}
        button,.btn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
        .secondary{background:#f1f5f9;color:#0f766e}
        #msg{margin-top:12px;font-size:.95em}
        #devLink{word-break:break-all;font-size:.85em;margin-top:10px}
    </style>
</head>
<body>
    <div class="card">
        <h1>Confirm your email</h1>
        <p>We sent a confirmation link to <span class="email">{{ email }}</span>. Confirm to unlock messaging, gifts, and the rest of {{ app_name }}.</p>
        <button onclick="resend()">Resend confirmation email</button>
        <a class="btn secondary" href="/logout">Log out</a>
        <div id="msg"></div>
        <div id="devLink"></div>
    </div>
    <script>
        async function resend() {
            const msg = document.getElementById('msg');
            msg.textContent = 'Sending…';
            try {
                const res = await fetch('/api/resend-verification', { method: 'POST' });
                const data = await res.json();
                msg.textContent = data.message || 'Done';
                if (data.dev_verify_link) {
                    document.getElementById('devLink').innerHTML =
                        `<p>Dev link:</p><a href="${data.dev_verify_link}">${data.dev_verify_link}</a>`;
                }
            } catch (e) {
                msg.textContent = 'Could not resend. Try again.';
            }
        }
    </script>
</body>
</html>
