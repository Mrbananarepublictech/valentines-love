<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — {{ app_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
            font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#0f172a,#1e3a5f 45%,#0f766e)}
        .card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
        h1{font-family:'Fraunces',serif;margin:0 0 8px}
        p{color:#64748b}
        label{display:block;font-weight:600;margin:14px 0 6px}
        input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;box-sizing:border-box}
        button{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer}
        #msg{margin-top:12px}
    </style>
</head>
<body>
    <div class="card">
        <h1>Choose a new password</h1>
        <p>Enter a new password for your {{ app_name }} account.</p>
        <form onsubmit="submitReset(event)">
            <label for="password">New password</label>
            <input id="password" type="password" minlength="6" required>
            <label for="password2">Confirm password</label>
            <input id="password2" type="password" minlength="6" required>
            <button type="submit">Update password</button>
        </form>
        <div id="msg"></div>
    </div>
    <script>
        const token = {{ token|tojson }};
        async function submitReset(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const msg = document.getElementById('msg');
            if (password !== password2) {
                msg.textContent = 'Passwords do not match';
                return;
            }
            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                msg.textContent = data.message;
                if (res.ok) setTimeout(() => location.href = '/', 1200);
            } catch (err) {
                msg.textContent = 'Something went wrong.';
            }
        }
    </script>
</body>
</html>
