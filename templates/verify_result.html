<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Confirmed' if success else 'Confirmation failed' }} — {{ app_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
            font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#0f172a,#1e3a5f 45%,#0f766e)}
        .card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
        h1{font-family:'Fraunces',serif;color:#0f172a}
        p{color:#64748b}
        a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:10px;background:#0f766e;color:#fff;text-decoration:none;font-weight:600}
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ 'Email confirmed' if success else 'Link invalid' }}</h1>
        <p>{{ message }}</p>
        <a href="{{ '/dashboard' if success else '/' }}">{{ 'Go to dashboard' if success else 'Back to login' }}</a>
    </div>
</body>
</html>
