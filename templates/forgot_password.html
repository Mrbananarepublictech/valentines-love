<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password — {{ app_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
            font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#0f172a,#1e3a5f 45%,#0f766e)}
        .card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
        h1{font-family:'Fraunces',serif;margin:0 0 8px}
        p{color:#64748b}
        label{display:block;font-weight:600;margin:14px 0 6px}
        input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;box-sizing:border-box}
        button{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer}
        a{color:#0f766e}
        #msg{margin-top:12px}
        #devLink{word-break:break-all;font-size:.85em}
    </style>
</head>
<body>
    <div class="card">
        <h1>Forgot password</h1>
        <p>Enter your account email and we’ll send a reset link.</p>
        <form onsubmit="submitForgot(event)">
            <label for="email">Email</label>
            <input id="email" type="email" required>
            <button type="submit">Send reset link</button>
        </form>
        <p style="margin-top:16px"><a href="/">Back to login</a></p>
        <div id="msg"></div>
        <div id="devLink"></div>
    </div>
    <script>
        async function submitForgot(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('msg');
            msg.textContent = 'Sending…';
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msg.textContent = data.message;
                if (data.dev_reset_link) {
                    document.getElementById('devLink').innerHTML =
                        `<p>Dev link:</p><a href="${data.dev_reset_link}">${data.dev_reset_link}</a>`;
                }
            } catch (err) {
                msg.textContent = 'Something went wrong.';
            }
        }
    </script>
</body>
</html>
